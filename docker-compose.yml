version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stocksense
      POSTGRES_PASSWORD: stocksense_pass
      POSTGRES_DB: stocksense
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksense -d stocksense"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      CLICKHOUSE_DB: stocksense
      CLICKHOUSE_USER: stocksense
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-stocksense_ch}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user stocksense --password ${CLICKHOUSE_PASSWORD:-stocksense_ch} --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  backend:
    build:
      context: ./stocksense-ai/backend
      dockerfile: Dockerfile
      target: serving
      args:
        MODEL_TICKERS: ${MODEL_TICKERS:-advertised}
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - 'ALLOWED_ORIGINS=["http://localhost:3000","http://frontend:3000"]'
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://stocksense:stocksense_pass@postgres:5432/stocksense
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEMO_MODE=${DEMO_MODE:-false}
      - MOOMOO_TRADE_ENABLED=false
      - MOOMOO_TRD_ENV=SIMULATE
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=stocksense
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-stocksense_ch}
      - CLICKHOUSE_DB=stocksense
    # Use the validated immutable image bundle; a volume would mask it with stale models.
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./stocksense-ai/frontend
      dockerfile: Dockerfile
      args:
        # Public browser URL, compiled by Next.js (not Docker's backend hostname).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  redis_data:
  postgres_data:
  clickhouse_data:

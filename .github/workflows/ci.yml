name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend — Python 3.12 CPU checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      # Same dependency/runtime stages as serving. No credentials or model
      # downloads on PRs, and no fake trained artifacts to make CI go green.
      # The serving target additionally loads every trusted model before release.
      - name: Blocking syntax, scoped lint and offline backend tests
        uses: docker/build-push-action@v6
        with:
          context: ./stocksense-ai/backend
          target: test
          platforms: linux/amd64
          push: false
          tags: stocksense-backend:test

  frontend-build:
    name: Frontend — Type Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: stocksense-ai/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: stocksense-ai/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker-build:
    name: Frontend — Docker build-time configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-checks, frontend-build]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend image with a safe public test URL
        uses: docker/build-push-action@v6
        with:
          context: ./stocksense-ai/frontend
          push: false
          tags: stocksense-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
